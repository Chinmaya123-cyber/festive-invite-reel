<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festive Invite Reel</title>
<link rel="stylesheet" href="fonts/all.css">
<style>
  html, body { margin: 0; background: #111; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FF006E; }
  .abs { position: absolute; left: 0; top: 0; }
  .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; text-align: center; will-change: transform; }
  .t span { display: inline-block; white-space: pre; }
  img.s { position: absolute; left: 0; top: 0; display: block; }
  #grain, #paper { pointer-events: none; }
  #hud { position: absolute; left: 12px; top: 12px; font: 600 26px/1.2 monospace; color: #fff; background: rgba(0,0,0,.55); padding: 6px 10px; z-index: 99; display: none; }
  .card { position: absolute; left: 0; top: 0; width: 660px; height: 940px; border-radius: 34px; overflow: hidden;
          box-shadow: 0 26px 0 rgba(42,5,24,.35), 0 0 0 10px #FFF8E8 inset; }
  .card .inner { position: absolute; inset: 30px; border-radius: 20px; border: 5px dashed; }
  .card .pip { position: absolute; font-family: 'Anton'; font-size: 92px; line-height: 1; }
  .card .pip i { display: block; width: 34px; height: 34px; margin: 10px auto 0; transform: rotate(45deg); }
  .card .word { position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%); font-family: 'Anton'; font-size: 84px;
                padding: 8px 34px 12px; border-radius: 14px; letter-spacing: .04em; white-space: nowrap; }
  .card img { position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<script src="timing.js"></script>
<script src="content.js"></script>
<script>
(() => {
const C = window.CONTENT;
const W = 1080, H = 1920;
const stage = document.getElementById('stage');
const Q = new URLSearchParams(location.search);
if (Q.has('hud')) document.getElementById('hud').style.display = 'block';

// ---------------------------------------------------------------- timing (all from timing.js)
const TM = window.TIMING;
const DROP = TM.drop, DECK_BEATS = TM.deckBeats, CARD_BEATS = TM.cardBeats, JOKER = TM.joker;
const T0 = TM.mainStart, JB = TM.beats, P = TM.plan;
const J = k => T0 + JB[Math.min(k, JB.length - 1)] + Math.max(0, k - (JB.length - 1)) * (JB[JB.length - 1] - JB[JB.length - 2]);
const END = TM.end;
const SLIDE_ENDS = [...P.slides.slice(1), P.address];
const FONT = {
  rozha: "font-family:'Rozha One'", anton: "font-family:'Anton'", shrikhand: "font-family:'Shrikhand'", bowlby: "font-family:'Bowlby One'",
  playfair: "font-family:'Playfair Display';font-style:italic;font-weight:900", playfairLight: "font-family:'Playfair Display';font-style:italic;font-weight:500",
  marcellus: "font-family:'Marcellus'", bricolage: "font-family:'Bricolage Grotesque';font-weight:800;font-stretch:75%", yatra: "font-family:'Yatra One'",
};
const isDeva = s => /[\u0900-\u097F]/.test(s);

// ---------------------------------------------------------------- maths
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const eo3 = u => 1 - Math.pow(1 - clamp(u), 3);
const ei2 = u => clamp(u) ** 2;
const eio = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const step = (t, fps) => Math.floor(t * fps + 1e-6) / fps;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const boil = (seed, t, amp = 1, fps = 8) => (hash(seed * 91.7 + Math.floor(t * fps)) * 2 - 1) * amp;
// spring pop 0 -> 1 with overshoot (closed form)
const pop = (t, t0, k = 1) => { const u = (t - t0) * k; if (u <= 0) return 0; return 1 - Math.exp(-u * 13) * Math.cos(u * 21); };
// decaying wiggle after a hit
const hit = (t, t0, f = 34, d = 9) => { const u = t - t0; if (u < 0) return 0; return Math.exp(-u * d) * Math.sin(u * f); };
const bump = (t, beats, d = 10) => { let v = 0; for (const b of beats) { const u = t - b; if (u >= 0 && u < .6) v = Math.max(v, Math.exp(-u * d)); } return v; };

// ---------------------------------------------------------------- dom helpers
function mk(parent, tag, cls, css, html) {
  const e = document.createElement(tag); if (cls) e.className = cls;
  if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; parent.appendChild(e); return e;
}
function place(e, x, y, s = 1, r = 0, o = 1, extra = '') {
  e.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) translate(-50%,-50%) rotate(${r.toFixed(3)}deg) scale(${Math.max(0, s).toFixed(4)})${extra}`;
  e.style.opacity = o;
}
const imgs = [];
const KERN = new Set(['WA', 'AW', 'AV', 'VA', 'TA', 'AT', 'AY', 'YA', 'LT', 'TY', 'PA', 'Y!', "'2"]);
function im(parent, name, w, css = '') {
  const e = mk(parent, 'img', 's', `width:${w}px;${css}`); e.src = `art/stickers/${name}.png`; imgs.push(e); return e;
}
function txt(parent, s, css, split = true) {
  const e = mk(parent, 'div', 't', css);
  if (split) { const arr = [...s]; arr.forEach((ch, i) => { const sp = mk(e, 'span', null, null, ch === ' ' ? '&nbsp;' : ch);
    if (KERN.has((arr[i - 1] || '') + ch)) sp.style.marginLeft = '-0.08em'; }); }
  else e.textContent = s;
  return e;
}
// per-letter pop (stepped for a stop-motion feel)
function letters(e, t, t0, { st = .028, fps = 24, drop = 40, rot = 8, seed = 1 } = {}) {
  const ts = step(t, fps);
  [...e.children].forEach((sp, i) => {
    const p = pop(ts, t0 + i * st);
    sp.style.opacity = p > 0 ? 1 : 0;
    sp.style.transform = `translateY(${(drop * (1 - Math.min(p, 1))).toFixed(1)}px) rotate(${(rot * (1 - p) * (i % 2 ? 1 : -1) + boil(seed + i, t, .8, 6)).toFixed(2)}deg) scale(${Math.max(0, p).toFixed(3)})`;
  });
}
const scenes = [];
function scene(a, b, css = '') {
  const root = mk(stage, 'div', 'scene', css);
  const sc = { a, b, root, fns: [] };
  sc.on = fn => sc.fns.push(fn);
  scenes.push(sc); return sc;
}
// 4-point sparkle star
const STAR = c => `<svg viewBox="-1 -1 2 2" width="100%" height="100%"><path fill="${c}" d="M0,-1 C.1,-.14 .14,-.1 1,0 C.14,.1 .1,.14 0,1 C-.1,.14 -.14,.1 -1,0 C-.14,-.1 -.1,-.14 0,-1Z"/></svg>`;
function star(parent, c, size) { return mk(parent, 'div', 'abs', `width:${size}px;height:${size}px`, STAR(c)); }
const PIN = `<svg viewBox="0 0 100 140" width="100%" height="100%"><path d="M50 136 C50 136 8 80 8 48 A42 42 0 1 1 92 48 C92 80 50 136 50 136Z" fill="#FF277F" stroke="#2A0518" stroke-width="6"/><circle cx="50" cy="48" r="17" fill="#FFF8B6" stroke="#2A0518" stroke-width="5"/></svg>`;

// colour mixing for card sunbursts
function mix(hex, to, a) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(hex), B = p(to); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], a)).toString(16).padStart(2, '0')).join('');
}
const burst = (a, b, at = '50% 45%', n = 10) => `repeating-conic-gradient(from 0deg at ${at}, ${a} 0 ${n}deg, ${b} ${n}deg ${2 * n}deg)`;

// damask / block-print motif for the maroon fabric scenes
const DAMASK = (() => {
  let p = '';
  for (let i = 0; i < 8; i++) p += `<ellipse cx="0" cy="-34" rx="13" ry="30" transform="rotate(${i * 45})"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><g fill="none" stroke="#E3A94B" stroke-opacity=".30" stroke-width="3">
    <g transform="translate(120 120)">${p}<circle r="12"/><circle r="74" stroke-dasharray="3 11"/></g>
    <g transform="translate(0 0)"><circle r="16"/><circle r="5" fill="#E3A94B" fill-opacity=".3"/></g><g transform="translate(240 0)"><circle r="16"/></g>
    <g transform="translate(0 240)"><circle r="16"/></g><g transform="translate(240 240)"><circle r="16"/></g></g></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
})();
const WEAVE = 'repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 2px, transparent 2px 5px), repeating-linear-gradient(90deg, rgba(255,220,180,.05) 0 2px, transparent 2px 6px)';

// ================================================================ SCENE A — intro: text slams synced to the intro track's voice
{
  const S = scene(0, DROP, `background:${C.intro.bg}`);
  const Y = C.intro.ink;
  const SL = C.intro.slams.map((sl, si) => {
    const to = sl.to === 'drop' ? DROP : sl.to;
    const o = { ...sl, to, si };
    if (sl.lines) {
      const sizes = Array.isArray(sl.size) ? sl.size : sl.lines.map(() => sl.size);
      o.els = sl.lines.map((l, i) => txt(S.root, l, `${FONT[sl.font] || FONT.rozha};font-size:${sizes[i]}px;color:${sl.color || Y};letter-spacing:.02em`, !isDeva(l)));
      o.sizes = sizes;
    }
    if (sl.sparkle) { o.sparks = [...Array(8)].map(() => star(S.root, Y, 200)); o.stick = (sl.stickers || []).map(n => im(S.root, n, 500)); }
    if (sl.stars) o.corner = [...Array(4)].map(() => star(S.root, Y, 110));
    return o;
  });
  S.on(t => {
    const ts = step(t, 12);
    const vis = (e, a, b) => (e.style.display = t >= a && t < b ? '' : 'none');
    SL.forEach(o => {
      if (o.els) {
        const n = o.els.length;
        const gap = o.sizes.map(z => z * .95);
        const total = gap.reduce((a, b) => a + b, 0);
        let y = 960 - total / 2;
        const jit = o.jitter ? ([1, .93, 1.06, .96, 1.03, .97][Math.floor((ts - o.at) / .33) % 6] || 1) : 1;
        const stepS = o.stepAt != null && ts >= o.stepAt ? 1.1 : 1;
        o.els.forEach((e, i) => {
          const la = o.lineAt ? o.lineAt[i] : o.at;
          vis(e, la, o.to);
          const cy = y + gap[i] / 2; y += gap[i];
          let s = jit * stepS;
          if (n === 1 && !o.zoom && o.si === 0) s *= 1 + .04 * (Math.floor(ts * 6) % 2);
          if (o.zoom) s *= 1 + 7 * ei2((t - (o.to - .16)) / .16);
          const single = n === 1 && (o.size >= 300);
          if (single) { place(e, 540, 960, pop(step(t, 24), o.at) * s, (o.si % 3 - 1) * 4 + boil(50 + o.si, t, 1.5)); return; }
          place(e, 540, cy, s, (i % 2 ? 1.5 : -2) + boil(6 + i + o.si * 7, t, 1));
          letters(e, t, o.si === 0 && la === 0 ? -.2 : la, { st: .028 });
        });
      }
      if (o.sparks) {
        const k = o.steps.findLastIndex(s => t >= s);
        const on = t >= o.at && t < o.to;
        o.sparks.forEach((s, i) => {
          s.style.display = on ? '' : 'none'; if (!on) return;
          const h = n => hash(k * 17 + i * 3 + n), side = i % 2 ? 1 : -1;
          place(s, 540 + side * (230 + h(1) * 290), 220 + (i / 8) * 1480 + h(2) * 120, (.45 + h(3) * .8) * pop(step(t, 24), o.steps[k] + i * .02), h(4) * 30);
        });
        o.stick.forEach((s, i) => { vis(s, o.steps[i], o.steps[i + 1] ?? o.to); place(s, 540 + boil(10 + i, t, 8), 960 + boil(20 + i, t, 8), pop(step(t, 24), o.steps[i]), (i % 2 ? 8 : -8) + boil(30 + i, t, 3)); });
      }
      if (o.corner) o.corner.forEach((s, i) => { vis(s, o.at, o.to); place(s, [150, 930, 170, 910][i], [330, 420, 1560, 1640][i], (.6 + .25 * Math.abs(Math.sin(ts * 5 + i))) * pop(t, o.at + i * .08), i * 20); });
    });
  });
}

// ================================================================ SCENE B — the drop: kaleido sunburst, the deck, cards flip on the beat
{
  const S = scene(DROP, J(P.ride));
  const M = '#FF006E', Y = '#FFD60A';
  const kTop = mk(S.root, 'div', 'abs', `width:2600px;height:2600px;left:-760px;top:-820px;background:${burst(M, Y, '50% 50%', 7.5)}`);
  const kBot = mk(S.root, 'div', 'abs', `width:2600px;height:2600px;left:-760px;top:140px;background:${burst(Y, M, '50% 50%', 7.5)}`);
  const kTopWrap = mk(S.root, 'div', 'abs', 'width:1080px;height:960px;overflow:hidden;top:0'); kTopWrap.appendChild(kTop);
  const kBotWrap = mk(S.root, 'div', 'abs', 'width:1080px;height:960px;overflow:hidden;top:960px'); kBotWrap.appendChild(kBot);
  kBot.style.top = '-1300px';
  // deck
  const deckW = 560;
  const deck = mk(S.root, 'div', 'abs', `width:${deckW}px;height:${deckW * 1400 / 950}px`);
  const dimg = im(deck, 'deck', deckW, 'position:absolute;left:0;top:0');
  mk(deck, 'div', 'abs', `left:${deckW * .375}px;top:${deckW * 1.474 * .135}px;width:${deckW * .555}px;height:${deckW * 1.474 * .1}px;display:flex;align-items:center;justify-content:center;
     font-family:'Bowlby One';font-size:40px;color:${Y};text-shadow:3px 3px 0 #2A0518;transform:skewY(-3deg);white-space:nowrap`, C.deck.title);
  const ring = mk(S.root, 'div', 'abs', `width:900px;height:900px;border-radius:50%;border:26px solid #FFF8B6`);
  const topT = txt(S.root, C.deck.top, `font-family:'Shrikhand';font-size:150px;color:${Y};-webkit-text-stroke:14px #2A0518;paint-order:stroke fill;text-shadow:8px 10px 0 #2A0518`);
  const pill = mk(S.root, 'div', 't', `font-family:'Anton';font-size:58px;color:#2A0518;background:#FFF8B6;padding:10px 30px 14px;border-radius:60px;letter-spacing:.12em;box-shadow:6px 8px 0 #2A0518`, C.deck.pill);
  const sparks = [...Array(6)].map(() => star(S.root, '#FFF8B6', 120));
  // cards
  const cards = C.cards.map((c, i) => {
    const e = mk(S.root, 'div', 'card', `background:${burst(c.bg, mix(c.bg, '#ffffff', .22), '50% 46%', 9)}`);
    mk(e, 'div', 'inner', `border-color:${c.ink}`);
    mk(e, 'div', 'pip', `left:56px;top:50px;color:${c.ink}`, `${c.pip}<i style="background:${c.ink}"></i>`);
    mk(e, 'div', 'pip', `right:56px;bottom:50px;color:${c.ink};transform:rotate(180deg)`, `${c.pip}<i style="background:${c.ink}"></i>`);
    const tall = ['girl', 'boy', 'sparkler', 'rocket'].includes(c.art);
    im(e, c.art, tall ? 330 : 450, 'position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);filter:drop-shadow(10px 14px 0 rgba(42,5,24,.28))');
    mk(e, 'div', 'word', `background:${c.ink};color:${c.bg};font-size:${c.word.length > 8 ? 72 : 84}px`, c.word);
    return e;
  });
  const JK = C.joker;
  const jk = mk(S.root, 'div', 'card', `background:${burst(JK.bg, mix(JK.bg, '#ffffff', .2), '50% 46%', 9)}`);
  mk(jk, 'div', 'inner', `border-color:${JK.ink}`);
  mk(jk, 'div', 'pip', `left:50px;top:46px;color:${JK.ink}`, `★`);
  mk(jk, 'div', 'pip', `right:50px;bottom:46px;color:${JK.ink};transform:rotate(180deg)`, `★`);
  mk(jk, 'div', 'abs', `left:0;top:170px;width:660px;text-align:center;font-family:'Bricolage Grotesque';font-weight:800;font-stretch:75%;font-size:150px;line-height:.9;color:${JK.ink};text-shadow:6px 8px 0 #2A0518`, JK.lines.join('<br>'));
  im(jk, JK.art, 330, 'position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);filter:drop-shadow(10px 14px 0 rgba(42,5,24,.28))');
  const tilt = C.cards.map((_, i) => [-5, 4, -3, 5, -4, 3, -5, 4][i % 8]);
  S.on(t => {
    const beatsAll = [DROP, ...DECK_BEATS, ...CARD_BEATS, JOKER];
    const b = bump(t, beatsAll, 7);
    const ang = t * 22;
    kTop.style.transform = `rotate(${ang}deg) scale(${1 + .05 * b})`;
    kBot.style.transform = `rotate(${-ang}deg) scale(${1 + .05 * b})`;
    // deck fall, land, wiggle, burst
    const deckOn = t < CARD_BEATS[0] + .16;
    deck.style.display = deckOn ? '' : 'none';
    if (deckOn) {
      const ts = step(t, 24);
      const fall = ei2((ts - DROP) / .32);
      let y = lerp(-700, 1010, fall);
      const land = DROP + .32;
      const sq = ts > land ? Math.exp(-(ts - land) * 9) * Math.cos((ts - land) * 30) : 0;
      let r = 0; DECK_BEATS.forEach((bt, i) => r += 7 * (i % 2 ? -1 : 1) * hit(ts, bt));
      const out = clamp((t - CARD_BEATS[0]) / .16);
      deck.style.transformOrigin = '50% 100%';
      place(deck, 540, y, 1 + .7 * eo3(out), r + boil(70, t, .8), 1 - out, ` scaleY(${1 - .14 * sq}) scaleX(${1 + .1 * sq})`);
    }
    const ru = (t - CARD_BEATS[0]) / .35;
    ring.style.display = ru > 0 && ru < 1 ? '' : 'none'; place(ring, 540, 960, .3 + 1.2 * eo3(ru), 0, 1 - ru);
    const topOn = t >= DECK_BEATS[0] && t < CARD_BEATS[0];
    topT.style.display = topOn ? '' : 'none'; place(topT, 540, 330, 1, -4 + boil(71, t, 1.2)); letters(topT, t, DECK_BEATS[0], { st: .03 });
    pill.style.display = t >= DECK_BEATS[1] && t < CARD_BEATS[0] ? '' : 'none'; place(pill, 540, 1680, pop(step(t, 24), DECK_BEATS[1]), 3 + boil(72, t, 1));
    sparks.forEach((s, i) => {
      const on = t >= DROP + .32 && t < CARD_BEATS[0];
      s.style.display = on ? '' : 'none';
      const a = i / 6 * Math.PI * 2 + .4;
      place(s, 540 + Math.cos(a) * 400, 1010 + Math.sin(a) * 520, (.5 + .4 * Math.abs(Math.sin(step(t, 8) * 4 + i))) * pop(t, DROP + .32 + i * .03), i * 15);
    });
    // cards: one per beat, quick flip-in, stop-motion boil
    cards.forEach((e, i) => {
      const a = CARD_BEATS[i], z = i < cards.length - 1 ? CARD_BEATS[i + 1] : JOKER; if (a == null) { e.style.display = 'none'; return; }
      const on = t >= a && t < z; e.style.display = on ? '' : 'none'; if (!on) return;
      const u = eo3((step(t, 24) - a) / .1);
      place(e, 540 + boil(80 + i, t, 4), 960 + boil(90 + i, t, 4), 1.12 - .12 * u, tilt[i] + boil(100 + i, t, .8), 1, ` perspective(1600px) rotateY(${(1 - u) * 85}deg)`);
    });
    const jon = t >= JOKER; jk.style.display = jon ? '' : 'none';
    if (jon) {
      const u = eo3((step(t, 24) - JOKER) / .1);
      const z = ei2((t - (J(P.ride) - .11)) / .11);
      place(jk, 540, 960, (1.12 - .12 * u) * (1 + 6 * z), lerp(-3, 0, z), 1, ` perspective(1600px) rotateY(${(1 - u) * 85}deg)`);
    }
  });
}

// ================================================================ SCENE C+D — main song kicks in: auto ride, NEXT STOP?, marigold strings, footprints
{
  const R = k => J(P.ride + k);
  const S = scene(R(0), J(P.title), `background-color:#7A0F33`);
  const bg = mk(S.root, 'div', 'full', `background-image:${DAMASK}, ${WEAVE};background-size:240px 240px, auto`);
  mk(S.root, 'div', 'full', 'background:radial-gradient(ellipse at 50% 45%, rgba(255,0,110,.22), rgba(20,0,8,.55) 75%)');
  const speed = [...Array(7)].map(() => mk(S.root, 'div', 'abs', 'height:8px;border-radius:8px;background:#FFF8B6'));
  const puffs = [...Array(8)].map(() => mk(S.root, 'div', 'abs', 'width:70px;height:70px;border-radius:50%;background:#F2D2A2'));
  const shadow = mk(S.root, 'div', 'abs', 'width:760px;height:60px;border-radius:50%;background:rgba(20,0,8,.45);filter:blur(6px)');
  const auto = im(S.root, 'auto', 940);
  const call = txt(S.root, C.ride.call, `font-family:'Shrikhand';font-size:104px;color:#FFF8B6;text-shadow:7px 8px 0 #2A0518`);
  const reply = mk(S.root, 'div', 't', `font-family:'Bowlby One';font-size:86px;color:#2A0518;background:#FFD60A;padding:22px 40px 30px;border-radius:70px;box-shadow:8px 10px 0 #2A0518`, C.ride.reply);
  // NEXT STOP? — two lines, font flips every beat
  const fonts = [
    `font-family:'Playfair Display';font-style:italic;font-weight:900;font-size:180px`,
    `font-family:'Anton';font-size:230px;letter-spacing:.02em`,
    `font-family:'Shrikhand';font-size:170px`,
    `font-family:'Marcellus';font-size:150px;letter-spacing:.1em`,
    `font-family:'Bowlby One';font-size:140px`,
  ];
  const ns = fonts.map((f, i) => mk(S.root, 'div', 't', `${f};line-height:.95;color:${i === 3 ? '#FFF8B6' : '#FFD60A'};text-shadow:8px 10px 0 #2A0518`, C.ride.nextStop.join('<br>')));
  const gNames = ['garland1', 'garland2', 'garland3', 'garland2', 'garland1', 'garland3'];
  const gX = [50, 165, 915, 1030];
  const gar = gX.map((x, i) => im(S.root, gNames[i], 150, 'transform-origin:50% 0'));
  const feet = [['footL', 470, 1660, -8], ['footR', 610, 1520, 6], ['footL', 480, 1360, -6]].map(f => ({ e: im(S.root, f[0], 130), x: f[1], y: f[2], r: f[3] }));
  S.on(t => {
    const ts = step(t, 12);

function seek(t) {
  for (const s of scenes) {
    const on = t >= s.a && t < s.b; s.root.style.display = on ? '' : 'none';
    if (on) s.fns.forEach(f => f(t));

  grain.style.background = `url(art/grain${k}.png) ${(hash(k) * 300) | 0}px ${(hash(k + 5) * 300) | 0}px / 1080px 1920px`;
  let sx = 0, sy = 0; for (const b of SHAKES) { const u = t - b; if (u >= 0 && u < .25) { const e = Math.exp(-u * 18) * 16; sx += e * Math.sin(u * 90); sy += e * Math.cos(u * 70); } }
  stage.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${sx || sy ? 1.03 : 1})`;
  document.getElementById('hud').textContent = t.toFixed(2) + 's';
}

  document.addEventListener('keydown', e => { if (e.code === 'Space') { if (audio.paused) { audio.play(); } else audio.pause(); } });
